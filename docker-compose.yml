# Base prod-like. Nilai env dari `.env` (salin dari `.env.example`)
# atau secret manager di platform deploy.
#   staging/prod : docker compose up -d --build
#   dev          : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      - APP_PORT=${APP_PORT:-8000}
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - postgres_db
      - redis


  postgres_db:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-devuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpassword}
      - POSTGRES_DB=${POSTGRES_DB:-lapor_ob}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
