version: '3.8'

services:
  backend: 
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    environment:
      - APP_PORT=8000
      - TZ=${TZ}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER}
      - DATABASE_URL=${DATABASE_URL}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - JWT_TOKEN=${JWT_TOKEN}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - postgres_db


  postgres_db:
    image: postgres:15.18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=lapor_ob
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis: 
    image: redis:latest
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
