version: '3.8'

services:
  backend: 
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
      - /app/src/generated/prisma
    environment:
      - APP_PORT=8000
      - STORAGE_PROVIDER=${STORAGE_PROVIDER}
      - DATABASE_URL=${DATABASE_URL}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - JWT_TOKEN=${JWT_TOKEN}
    depends_on:
      - postgres_db


  postgres_db:
    image: postgres:15.18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=lapor_ob
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: