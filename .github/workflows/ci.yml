# Gate QA: PR ke staging/prod wajib hijau.
# Alur branch: feature/* -> dev -> (PR) staging [QA] -> (PR + tag) prod.

name: ci

on:
  pull_request:
    branches: [staging, prod]
  push:
    branches: [dev, staging]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run test:unit
