# PROD — image prod-like (Dockerfile), TANPA seed, TANPA volume source code.
# Nilai env dari platform deploy / secret manager (file lokal: salin .env.example jadi .env).
# Pakai: docker compose -f docker-compose.prod.yml up -d --build
# Hanya diupdate via MR staging -> prod yang sudah lolos QA + tag v1.x.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      - APP_PORT=${APP_PORT:-8000}
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - ./uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    restart: always
    depends_on:
      - postgres_db
      - redis

  postgres_db:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-produser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-lapor_ob}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_prod_data:/data

volumes:
  postgres_prod_data:
  redis_prod_data:
