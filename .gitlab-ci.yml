# Gate QA: MR ke staging/prod wajib hijau.
# Alur branch: feature/* -> dev -> (MR) staging [QA] -> (MR + tag) prod.

stages:
  - validate

validate:
  stage: validate
  image: node:22-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'dev'
    - if: $CI_COMMIT_BRANCH == 'staging'
    - if: $CI_COMMIT_BRANCH == 'prod'
  before_script:
    - node --version
    - npm ci
    - npx prisma generate
  script:
    - npx tsc --noEmit
    - npm run test:unit
