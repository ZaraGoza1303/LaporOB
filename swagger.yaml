openapi: 3.0.0
info:
  title: LaporOB API
  description: API aplikasi LaporOB 
  version: 1.0.0

servers:
  - url: https://stylar-nonseverable-denver.ngrok-free.dev
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    PatchLaporanRequest:
      type: object
      description: |
        Partial update laporan admin. Setidaknya satu field harus berisi nilai non-null.
        String kosong (`""`) otomatis dianggap `null` oleh server.
      properties:
        status:
          type: string
          nullable: true
          enum:
            - BELUM_DIKERJAKAN
            - PENDING
            - SELESAI
            - DIBATALKAN
          description: Status baru laporan (auto-set timestamp sesuai status)
        prioritas:
          type: string
          nullable: true
          enum:
            - STANDARD
            - URGENT
          description: Prioritas laporan
        ob_id:
          type: string
          format: uuid
          nullable: true
          description: |
            UUID OB yang ditugaskan. Untuk un-assign OB, gunakan `status: BELUM_DIKERJAKAN`
            (otomatis reset ob_id) — mengirim `ob_id: null` saja akan gagal validasi.
        lantai_id:
          type: string
          format: uuid
          nullable: true
          description: Pindahkan laporan ke lantai lain (nullable)
        ruangan_id:
          type: string
          format: uuid
          nullable: true
          description: Pindahkan laporan ke ruangan lain (nullable)
        admin_catatan:
          type: string
          nullable: true
          maxLength: 1000
          description: Catatan internal admin

    AdminReportDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - BELUM_DIKERJAKAN
            - PENDING
            - SELESAI
            - DIBATALKAN
        prioritas:
          type: string
          enum:
            - STANDARD
            - URGENT
        nama_karyawan:
          type: string
        lokasi:
          type: string
        kategori:
          type: string
        ob_ditugaskan:
          type: string
          nullable: true
        waktu_laporan:
          type: string
          format: date-time
        waktu_selesai:
          type: string
          format: date-time
          nullable: true
          description: Waktu histori pekerjaan terakhir (jika ada)
        dikerjakan_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp saat laporan mulai dikerjakan (OB ambil / status PENDING)
        selesai_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp saat admin approve sebagai selesai
        dibatalkan_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp saat laporan dibatalkan
        admin_catatan:
          type: string
          nullable: true
          maxLength: 1000
          description: Catatan internal admin
        deskripsi_kendala:
          type: string
        bukti_foto:
          type: object
          properties:
            urls:
              type: array
              items:
                type: string
            diupload_oleh:
              type: string
              nullable: true
            jam_upload:
              type: string
              nullable: true

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nama_lengkap:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
        profile_picture:
          type: string
          nullable: true

    MappedProfileReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kategori:
          type: string
        deskripsi_kendala:
          type: string
        status:
          type: string
          enum:
            - BELUM_DIKERJAKAN
            - PENDING
            - SELESAI
            - DIBATALKAN
        prioritas:
          type: string
          enum:
            - STANDARD
            - URGENT
        foto_masalah:
          type: array
          items:
            type: string
        lokasi:
          type: string
        nomor_lantai:
          type: integer
        nama_ob:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedProfileReports:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MappedProfileReport'
        next_cursor:
          type: string
          nullable: true
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ProfileRes:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nama_lengkap:
              type: string
            username:
              type: string
            email:
              type: string
            role:
              type: string
            profile_picture:
              type: string
              nullable: true
            total_laporan:
              type: integer
              nullable: true
            tasksCompleted:
              type: integer
              nullable: true
            rejected:
              type: integer
              nullable: true
        laporan:
          $ref: '#/components/schemas/PaginatedProfileReports'
    GabungResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        laporan_id:
          type: string
          format: uuid
        ob_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        created_at:
          type: string
          format: date-time

    DaftarGabungItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ob:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nama_lengkap:
              type: string
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        created_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Username atau email
        password:
          type: string
          format: password

    ActivateAccountRequest:
      type: object
      required:
        - password
        - confirmPassword
      properties:
        password:
          type: string
          format: password
          description: Password minimal 6 karakter
        confirmPassword:
          type: string
          format: password
          description: Konfirmasi password, harus sama dengan password

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email akun user yang terdaftar

    ResetPasswordRequest:
      type: object
      required:
        - password
        - confirmPassword
      properties:
        password:
          type: string
          format: password
          description: Password baru minimal 6 karakter
        confirmPassword:
          type: string
          format: password
          description: Konfirmasi password baru, harus sama dengan password

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
        - confirmNewPassword
      properties:
        oldPassword:
          type: string
          format: password
          description: Password lama
        newPassword:
          type: string
          format: password
          description: Password baru minimal 6 karakter
        confirmNewPassword:
          type: string
          format: password
          description: Konfirmasi password baru, harus sama dengan newPassword

    PaginationMeta:
      type: object
      properties:
        total_items:
          type: integer
        current_page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer

    Notifikasi:
      type: object
      properties:
        id:
          type: string
          format: uuid
        penerima_id:
          type: string
          format: uuid
        pengirim_id:
          type: string
          format: uuid
        tipe:
          type: string
        judul:
          type: string
        pesan:
          type: string
          nullable: true
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        ref_id:
          type: string
          format: uuid
          nullable: true
          description: ID dari entitas terkait (laporan, kolaborasi, checklist, dll)
        ref_tipe:
          type: string
          nullable: true
          description: Tipe entitas terkait (LAPORAN, KOLABORASI, CHECKLIST, dll)
        created_at:
          type: string
          format: date-time
        pengirim:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nama_lengkap:
              type: string

    TugasResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kategori_id:
          type: string
          format: uuid
        nama_tugas:
          type: string
        lantai_id:
          type: string
          format: uuid
          nullable: true
        ob_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [BELUM_DIKERJAKAN, SEDANG_DIKERJAKAN, SELESAI, TERLEWAT]
        catatan:
          type: string
          nullable: true
        is_active:
          type: boolean
        dikerjakan_at:
          type: string
          format: date-time
          nullable: true
        selesai_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ObTugasItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nama_tugas:
          type: string
        kategori:
          type: string
          description: Nama kategori
        lantai_id:
          type: string
          format: uuid
          nullable: true
        lokasi:
          type: string
          description: Nama lokasi
        nomor_lantai:
          type: integer
          nullable: true
        status:
          type: string
          enum: [BELUM_DIKERJAKAN, SEDANG_DIKERJAKAN, SELESAI, TERLEWAT]
        catatan:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ChecklistHarianResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tanggal:
          type: string
          format: date
        ob_id:
          type: string
          format: uuid
          nullable: true
        lantai_id:
          type: string
          format: uuid
        kategori_id:
          type: string
          format: uuid
        nama_tugas:
          type: string
          description: Nama tugas langsung (independen dari master Tugas)
        status:
          type: string
          enum:
            - BELUM_DIKERJAKAN
            - SEDANG_DIKERJAKAN
            - SELESAI
            - TERLEWAT
        catatan:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JadwalChecklistRequest:
      type: object
      required:
        - nama_tugas
        - kategori_id
        - lantai_id
        - tanggal_mulai
        - tanggal_selesai
      properties:
        nama_tugas:
          type: string
          maxLength: 150
        kategori_id:
          type: string
          format: uuid
        lantai_id:
          type: string
          format: uuid
        ob_id:
          type: string
          format: uuid
          nullable: true
        hari:
          type: array
          items:
            type: string
          description: Hari pengulangan ["senin","rabu"] atau [] = tiap hari
        tanggal_ulang:
          type: integer
          nullable: true
          description: Tanggal ulang tiap bulan (1-31)
        tanggal_spesifik:
          type: array
          items:
            type: string
            format: date
          description: Tanggal-tanggal spesifik
        tanggal_mulai:
          type: string
          format: date-time
          description: Awal rentang jadwal (ISO 8601)
        tanggal_selesai:
          type: string
          format: date-time
          description: Akhir rentang jadwal (ISO 8601)

    JadwalChecklistResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nama_tugas:
          type: string
        kategori_id:
          type: string
          format: uuid
        lantai_id:
          type: string
          format: uuid
        ob_id:
          type: string
          format: uuid
          nullable: true
        hari:
          type: array
          items:
            type: string
        tanggal_ulang:
          type: integer
          nullable: true
        tanggal_spesifik:
          type: array
          items:
            type: string
            format: date
        tanggal_mulai:
          type: string
          format: date-time
        tanggal_selesai:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AppConstantsResponse:
      type: object
      properties:
        hari:
          type: array
          items:
            type: string
        checklist_status:
          type: array
          items:
            type: string
        tugas_status:
          type: array
          items:
            type: string
        laporan_status:
          type: array
          items:
            type: string
        laporan_priority:
          type: array
          items:
            type: string
        kolaborasi_status:
          type: array
          items:
            type: string
        user_role:
          type: array
          items:
            type: string
        ref_tipe:
          type: array
          items:
            type: string

# AUTH
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login user (Publik)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      jwt_token:
                        type: string
        '401':
          description: Login gagal

  /api/auth/check-token:
    get:
      tags:
        - Auth
      summary: Verifikasi token aktivasi (Publik)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token valid

  /api/auth/activate-account:
    post:
      tags:
        - Auth
      summary: Aktivasi akun & set password (Publik)
      description: Set password pertama kali setelah admin buat akun, link dari email
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Token aktivasi dari URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequest'
      responses:
        '200':
          description: Akun berhasil diaktivasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Akun berhasil diaktivasi, silahkan login
        '400':
          description: Token tidak valid / Validation Failed / Password tidak cocok

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout & revoke session (Terautentikasi)
      description: Revoke session aktif, token gak bisa dipake lagi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logout berhasil
        '401':
          description: Session tidak valid / Token expired

  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Lupa password - Request Reset Link (Publik)
      description: Mengirim email berisi token/URL reset password jika email terdaftar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Request reset diproses (link terkirim)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Link reset password telah dikirim ke email Anda
        '404':
          description: Email tidak terdaftar
        '500':
          description: Gagal memproses permintaan reset password

  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Lupa password - Reset Password (Publik)
      description: Mengubah password lama dengan password baru menggunakan token dari email.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Token reset password dari email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password berhasil diubah, silakan login
        '401':
          description: Token tidak valid / kadaluwarsa / sudah digunakan
        '400':
          description: Validation Failed (password tidak cocok atau kurang dari 6 karakter)

  /api/auth/change-password:
    post:
      tags:
        - Auth
      summary: Ubah password (Terautentikasi)
      description: Mengubah password untuk user yang sudah login.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password berhasil diubah
        '400':
          description: Password lama salah / validation failed
        '401':
          description: Unauthorized

# USER / PROFILE
  /api/user/profile:
    get:
      tags:
        - User
      summary: Ambil profil + riwayat laporan (Semua role)
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Cari laporan
        - name: status
          in: query
          schema:
            type: string
          description: Filter status laporan
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor pagination
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ProfileRes'

    patch:
      tags:
        - User
      summary: Update profile sendiri (Semua role)
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nama_lengkap:
                  type: string
                  description: Nama lengkap user
                profile_picture:
                  type: string
                  format: binary
                  description: File foto profil
      responses:
        '200':
          description: Berhasil mengubah profile
        '400':
          description: Validation Failed
        '401':
          description: Unauthorized
        '404':
          description: User tidak ditemukan

  /api/user/profile/laporan/{laporan_id}:
    get:
      tags:
        - User
      summary: Detail laporan user (OB & Karyawan)
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Berhasil

# KARYAWAN
  /api/karyawan/dashboard:
    get:
      tags:
        - Karyawan
      summary: 'Dashboard karyawan (Karyawan)'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil

  /api/karyawan/laporan:
    post:
      tags:
        - Karyawan
      summary: 'Buat laporan baru (Karyawan)'
      description: |
        Karyawan membuat laporan masalah/kendala baru.
        
        **WebSocket Notification**: Notifikasi real-time dikirim ke semua OB dan admin via WebSocket dengan tipe `ADMIN_MENUGASKAN_OB`
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - lantai_id
                - ruangan_id
                - kategori_id
                - deskripsi_kendala
                - prioritas
                - foto_masalah
              properties:
                lantai_id:
                  type: string
                  format: uuid
                ruangan_id:
                  type: string
                  format: uuid
                kategori_id:
                  type: string
                  format: uuid
                deskripsi_kendala:
                  type: string
                prioritas:
                  type: string
                  enum:
                    - STANDARD
                    - URGENT
                foto_masalah:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Foto masalah (max 5)
      responses:
        '201':
          description: Laporan berhasil dibuat

# OB
  /api/ob/dashboard:
    get:
      tags:
        - OB
      summary: 'Dashboard OB (OB)'
      description: |
        Menampilkan ringkasan tugas harian milik OB yang login.

        Response berisi:
        - `tugas_harian`: array tugas harian hari ini
        - `tugas_harian_stats`: statistik total/resolved/pending tugas harian
        - `laporan`: daftar laporan yang relevan

        Laporan yang ditampilkan:
        - Semua laporan yang sudah di-assign ke OB ini (`ob_id` = OB login)
        - Laporan belum di-assign (`ob_id` null) dengan status selain `PENDING`
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      ob:
                        type: object
                        properties:
                          nama_lengkap:
                            type: string
                      tugas_harian_stats:
                        type: object
                        properties:
                          total:
                            type: integer
                          resolved:
                            type: integer
                          pending:
                            type: integer
                      tugas_harian:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            nama_tugas:
                              type: string
                            kategori:
                              type: string
                            lokasi:
                              type: string
                            nomor_lantai:
                              type: integer
                            status:
                              type: string
                            tanggal:
                              type: string
                              format: date
                      laporan:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
