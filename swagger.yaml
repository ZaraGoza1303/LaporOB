# NOTIFIKASI
  /api/notifikasi:
    get:
      tags:
        - Notifikasi
      summary: 'Ambil notifikasi hari ini & kemarin (Semua role)'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar notifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Berhasil mendapatkan notifikasi
                  data:
                    type: object
                    properties:
                      hari_ini:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notifikasi'
                      kemarin:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notifikasi'

  /api/notifikasi/unread-count:
    get:
      tags:
        - Notifikasi
      summary: 'Hitung notifikasi belum dibaca (Semua role)'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Jumlah notifikasi belum dibaca
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Berhasil mendapatkan total pesan yang belum dibaca
                  data:
                    type: integer
                    example: 5

  /api/notifikasi/read-all:
    patch:
      tags:
        - Notifikasi
      summary: 'Tandai semua notifikasi sudah dibaca (Semua role)'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Semua notifikasi berhasil dibaca

  /api/notifikasi/{notification_id}/read:
    patch:
      tags:
        - Notifikasi
      summary: 'Tandai satu notifikasi sudah dibaca (Semua role)'
      security:
        - BearerAuth: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notifikasi berhasil dibaca
