# CHECKLIST HARIAN
  /api/checklist-harian:
    get:
      tags:
        - Checklist Harian
      summary: 'List checklist harian (OB, HR, Admin)'
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
          description: Cari checklist berdasarkan nama tugas
        - name: lokasi_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter checklist berdasarkan lokasi id
        - name: lantai_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter checklist berdasarkan lantai id
        - name: status
          in: query
          schema:
            type: string
            enum:
              - BELUM_DIKERJAKAN
              - SEDANG_DIKERJAKAN
              - SELESAI
              - TERLEWAT
          description: Filter checklist berdasarkan status
      responses:
        '200':
          description: Daftar checklist
    post:
      tags:
        - Checklist Harian
      summary: 'Buat checklist harian (Admin)'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tugas_id
                - kategori_id
                - lokasi_id
                - lantai_id
              properties:
                tugas_id:
                  type: string
                  format: uuid
                kategori_id:
                  type: string
                  format: uuid
                lokasi_id:
                  type: string
                  format: uuid
                lantai_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Checklist berhasil dibuat

  /api/checklist-harian/{checklist_harian_id}:
    get:
      tags:
        - Checklist Harian
      summary: 'Detail checklist (OB, HR, Admin)'
      security:
        - BearerAuth: []
      parameters:
        - name: checklist_harian_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data checklist
    patch:
      tags:
        - Checklist Harian
      summary: 'Edit checklist (Admin)'
      security:
        - BearerAuth: []
      parameters:
        - name: checklist_harian_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tugas_id:
                  type: string
                  format: uuid
                kategori_id:
                  type: string
                  format: uuid
                lokasi_id:
                  type: string
                  format: uuid
                lantai_id:
                  type: string
                  format: uuid
                ob_id:
                  type: string
                  format: uuid
                  nullable: true
