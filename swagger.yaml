  /api/ob/laporan/{laporan_id}:
    patch:
      tags:
        - OB
      summary: 'Ambil laporan (OB)'
      description: |
        OB mengambil laporan yang tersedia. Side effect otomatis:
        - `status` → `PENDING`
        - `ob_id` → di-set ke OB yang login
        - `dikerjakan_at` → di-set ke waktu saat ini
        
        **WebSocket Notification**: Notifikasi real-time dikirim ke pelapor via WebSocket dengan tipe `LAPORAN_DIKERJAKAN` (terkoneksi ke `/ws` dengan JWT token)
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Laporan berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Laporan berhasil diambil
        '400':
          description: Validation Failed (format laporan_id tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (bukan OB)
        '404':
          description: Laporan tidak ditemukan
        '409':
          description: Laporan sudah diambil oleh OB lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Terjadi kesalahan, tidak bisa mengambil laporan

    post:
      tags:
        - OB
      summary: 'Submit hasil pekerjaan (OB)'
      description: |
        OB submit bukti penyelesaian. Side effect otomatis:
        - `status` → `SELESAI`
        - `selesai_at` → di-set ke waktu saat ini
        
        **WebSocket Notification**: Notifikasi real-time dikirim ke pelapor via WebSocket dengan tipe `LAPORAN_BERES` dan pesan berisi catatan
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - catatan
                - foto_selesai
              properties:
                catatan:
                  type: string
                foto_selesai:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Foto bukti penyelesaian pekerjaan
      responses:
        '200':
          description: Histori berhasil ditambahkan
        '403':
          description: Anda tidak memiliki akses ke laporan ini (bukan OB pemilik)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Laporan tidak ditemukan
        '500':
          description: Terjadi kesalahan

  /api/ob/laporan/{laporan_id}/batalkan:
    post:
      tags:
        - OB
      summary: 'Batalkan laporan (OB)'
      description: |
        OB membatalkan laporan (membatalkan pengambilan). Laporan dikembalikan ke antrean.Side effect otomatis:
        - `status` → `DIBATALKAN`
        - `ob_id` → `null` (laporan bisa diambil OB lain)
        - `dibatalkan_at` → di-set ke waktu saat ini
        - `alasan_gagal` → diisi dari catatan pembatalan
         **WebSocket Notification**: Notifikasi real-time dikirim ke pelapor via WebSocket dengan tipe `LAPORAN_DIBATALKAN` dan pesan berisi alasan pembatalan
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - catatan
              properties:
                catatan:
                  type: string
                  description: Catatan pembatalan (min 5 karakter)
                foto_selesai:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Foto bukti pembatalan laporan (opsional)
      responses:
        '200':
          description: Laporan dibatalkan
        '403':
          description: Anda tidak memiliki akses ke laporan ini (bukan OB pemilik)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Laporan tidak ditemukan
        '500':
          description: Terjadi kesalahan

