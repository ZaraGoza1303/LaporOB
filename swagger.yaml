        Membuat tugas baru.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kategori_id
                - nama_tugas
                - tanggal_mulai
                - tanggal_selesai
              properties:
                kategori_id:
                  type: string
                  format: uuid
                nama_tugas:
                  type: string
                lantai_id:
                  type: string
                  format: uuid
                  description: Lantai lokasi tugas (opsional)
                catatan:
                  type: string
                  description: Catatan tambahan untuk OB (opsional)
                tanggal_mulai:
                  type: string
                  format: date-time
                  description: Awal rentang tugas (ISO 8601, wajib)
                tanggal_selesai:
                  type: string
                  format: date-time
                  description: Akhir rentang tugas (ISO 8601, wajib)
      responses:
        '201':
          description: Tugas berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
