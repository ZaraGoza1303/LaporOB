openapi: 3.0.0
info:
  title: LaporOB API
  description: API aplikasi LaporOB 
  version: 1.0.0

servers:
  - url: https://stylar-nonseverable-denver.ngrok-free.dev
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    PatchLaporanRequest:
      type: object
      description: |
        Partial update laporan admin. Setidaknya satu field harus berisi nilai non-null.
        String kosong (`""`) otomatis dianggap `null` oleh server.
      properties:
        status:
          type: string
          nullable: true
          enum:
            - BELUM_DIKERJAKAN
            - PENDING
            - SELESAI
            - DIBATALKAN
          description: Status baru laporan (auto-set timestamp sesuai status)
        prioritas:
          type: string
          nullable: true
          enum:
            - STANDARD
            - URGENT
          description: Prioritas laporan
        ob_id:
          type: string
          format: uuid
          nullable: true
          description: |
            UUID OB yang ditugaskan. Untuk un-assign OB, gunakan `status: BELUM_DIKERJAKAN`
            (otomatis reset ob_id) — mengirim `ob_id: null` saja akan gagal validasi.
        lantai_id:
          type: string
          format: uuid
          nullable: true
          description: Pindahkan laporan ke lantai lain (nullable)
        ruangan_id:
          type: string
          format: uuid
          nullable: true
          description: Pindahkan laporan ke ruangan lain (nullable)
        admin_catatan:
          type: string
          nullable: true
          maxLength: 1000
          description: Catatan internal admin

    AdminReportDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - BELUM_DIKERJAKAN
            - PENDING
            - SELESAI
            - DIBATALKAN
        prioritas:
          type: string
          enum:
            - STANDARD
            - URGENT
        nama_karyawan:
          type: string
        lokasi:
          type: string
        kategori:
          type: string
        ob_ditugaskan:
          type: string
          nullable: true
        waktu_laporan:
          type: string
          format: date-time
        waktu_selesai:
          type: string
          format: date-time
          nullable: true
          description: Waktu histori pekerjaan terakhir (jika ada)
        dikerjakan_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp saat laporan mulai dikerjakan (OB ambil / status PENDING)
        selesai_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp saat admin approve sebagai selesai
        dibatalkan_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp saat laporan dibatalkan
        admin_catatan:
          type: string
          nullable: true
          maxLength: 1000
          description: Catatan internal admin
        deskripsi_kendala:
          type: string
        bukti_foto:
          type: object
          properties:
            urls:
              type: array
              items:
                type: string
            diupload_oleh:
              type: string
              nullable: true
            jam_upload:
              type: string
              nullable: true

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nama_lengkap:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
        profile_picture:
          type: string
          nullable: true

    MappedProfileReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kategori:
          type: string
        deskripsi_kendala:
          type: string
        status:
          type: string
          enum:
            - BELUM_DIKERJAKAN
            - PENDING
            - SELESAI
            - DIBATALKAN
        prioritas:
          type: string
          enum:
            - STANDARD
            - URGENT
        foto_masalah:
          type: array
          items:
            type: string
        lokasi:
          type: string
        nomor_lantai:
          type: integer
        nama_ob:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedProfileReports:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MappedProfileReport'
        next_cursor:
          type: string
          nullable: true
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ProfileRes:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nama_lengkap:
              type: string
            username:
              type: string
            email:
              type: string
            role:
              type: string
            profile_picture:
              type: string
              nullable: true
            total_laporan:
              type: integer
              nullable: true
            tasksCompleted:
              type: integer
              nullable: true
            rejected:
              type: integer
              nullable: true
        laporan:
          $ref: '#/components/schemas/PaginatedProfileReports'
    GabungResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        laporan_id:
          type: string
          format: uuid
        ob_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        created_at:
          type: string
          format: date-time

    DaftarGabungItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ob:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nama_lengkap:
              type: string
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        created_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Username atau email
        password:
          type: string
          format: password

    ActivateAccountRequest:
      type: object
      required:
        - password
        - confirmPassword
      properties:
        password:
          type: string
          format: password
          description: Password minimal 6 karakter
        confirmPassword:
          type: string
          format: password
          description: Konfirmasi password, harus sama dengan password

    PaginationMeta:
      type: object
      properties:
        total_items:
          type: integer
        current_page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer

    Notifikasi:
      type: object
      properties:
        id:
          type: string
          format: uuid
        penerima_id:
          type: string
          format: uuid
        pengirim_id:
          type: string
          format: uuid
        tipe:
          type: string
        judul:
          type: string
        pesan:
          type: string
          nullable: true
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        pengirim:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nama_lengkap:
              type: string

# AUTH
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login user (Publik)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      jwt_token:
                        type: string
        '401':
          description: Login gagal

  /api/auth/check-token:
    get:
      tags:
        - Auth
      summary: Verifikasi token aktivasi (Publik)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token valid

  /api/auth/activate-account:
    post:
      tags:
        - Auth
      summary: Aktivasi akun & set password (Publik)
      description: Set password pertama kali setelah admin buat akun, link dari email
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Token aktivasi dari URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequest'
      responses:
        '200':
          description: Akun berhasil diaktivasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Akun berhasil diaktivasi, silahkan login
        '400':
          description: Token tidak valid / Validation Failed / Password tidak cocok

# USER / PROFILE
  /api/user/profile:
    get:
      tags:
        - User
      summary: Ambil profil + riwayat laporan (Semua role)
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Cari laporan
        - name: status
          in: query
          schema:
            type: string
          description: Filter status laporan
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor pagination
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ProfileRes'

    patch:
      tags:
        - User
      summary: Update profile sendiri (Semua role)
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nama_lengkap:
                  type: string
                  description: Nama lengkap user
                profile_picture:
                  type: string
                  format: binary
                  description: File foto profil
      responses:
        '200':
          description: Berhasil mengubah profile
        '400':
          description: Validation Failed
        '401':
          description: Unauthorized
        '404':
          description: User tidak ditemukan

  /api/user/profile/laporan/{laporan_id}:
    get:
      tags:
        - User
      summary: Detail laporan user (OB & Karyawan)
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Berhasil

# KARYAWAN
  /api/karyawan/dashboard:
    get:
      tags:
        - Karyawan
      summary: 'Dashboard karyawan (Karyawan)'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil

  /api/karyawan/laporan:
    post:
      tags:
        - Karyawan
      summary: 'Buat laporan baru (Karyawan)'
      description: |
        Karyawan membuat laporan masalah/kendala baru.
        
        **WebSocket Notification**: Notifikasi real-time dikirim ke semua OB dan admin via WebSocket dengan tipe `ADMIN_MENUGASKAN_OB`
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - lantai_id
                - ruangan_id
                - kategori_id
                - deskripsi_kendala
                - prioritas
                - foto_masalah
              properties:
                lantai_id:
                  type: string
                  format: uuid
                ruangan_id:
                  type: string
                  format: uuid
                kategori_id:
                  type: string
                  format: uuid
                deskripsi_kendala:
                  type: string
                prioritas:
                  type: string
                  enum:
                    - STANDARD
                    - URGENT
                foto_masalah:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Foto masalah (max 5)
      responses:
        '201':
          description: Laporan berhasil dibuat

# OB
  /api/ob/dashboard:
    get:
      tags:
        - OB
      summary: 'Dashboard OB (OB)'
      description: |
        Menampilkan checklist harian dan daftar laporan OB.
        Laporan yang ditampilkan:
        - Semua laporan yang sudah di-assign ke OB ini (`ob_id` = OB login)
        - Laporan belum di-assign (`ob_id` null) dengan status selain `PENDING`
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil

  /api/ob/laporan/{laporan_id}:
    patch:
      tags:
        - OB
      summary: 'Ambil laporan (OB)'
      description: |
        OB mengambil laporan yang tersedia. Side effect otomatis:
        - `status` → `PENDING`
        - `ob_id` → di-set ke OB yang login
        - `dikerjakan_at` → di-set ke waktu saat ini
        
        **WebSocket Notification**: Notifikasi real-time dikirim ke pelapor via WebSocket dengan tipe `LAPORAN_DIKERJAKAN` (terkoneksi ke `/ws` dengan JWT token)
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Laporan berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Laporan berhasil diambil
        '400':
          description: Validation Failed (format laporan_id tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (bukan OB)
        '404':
          description: Laporan tidak ditemukan
        '409':
          description: Laporan sudah diambil oleh OB lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Terjadi kesalahan, tidak bisa mengambil laporan

  /api/ob/laporan/{laporan_id}:
    post:
      tags:
        - OB
      summary: 'Submit hasil pekerjaan (OB)'
      description: |
        OB submit bukti penyelesaian. Side effect otomatis:
        - `status` → `SELESAI`
        - `selesai_at` → di-set ke waktu saat ini
        
        **WebSocket Notification**: Notifikasi real-time dikirim ke pelapor via WebSocket dengan tipe `LAPORAN_BERES` dan pesan berisi catatan
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - catatan
                - foto_selesai
              properties:
                catatan:
                  type: string
                foto_selesai:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Foto bukti penyelesaian pekerjaan
      responses:
        '200':
          description: Histori berhasil ditambahkan
        '403':
          description: Anda tidak memiliki akses ke laporan ini (bukan OB pemilik)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Laporan tidak ditemukan
        '500':
          description: Terjadi kesalahan

  /api/ob/laporan/{laporan_id}/tolak:
    post:
      tags:
        - OB
      summary: 'Batalkan laporan (OB)'
      description: |
        OB membatalkan laporan (membatalkan pengambilan). Laporan dikembalikan ke antrean.Side effect otomatis:
        - `status` → `DIBATALKAN`
        - `ob_id` → `null` (laporan bisa diambil OB lain)
        - `dibatalkan_at` → di-set ke waktu saat ini
        - `alasan_gagal` → diisi dari catatan penolakan
         **WebSocket Notification**: Notifikasi real-time dikirim ke pelapor via WebSocket dengan tipe `LAPORAN_DIBATALKAN` dan pesan berisi alasan penolakan
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - catatan
                - foto_selesai
              properties:
                catatan:
                  type: string
                  description: Catatan pembatalan (min 5 karakter)
                foto_selesai:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Foto bukti pembatalan laporan
      responses:
        '200':
          description: Laporan dibatalkan
        '403':
          description: Anda tidak memiliki akses ke laporan ini (bukan OB pemilik)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Laporan tidak ditemukan
        '500':
          description: Terjadi kesalahan

  /api/ob/laporan/{laporan_id}/gabung:
    get:
      tags:
        - OB
      summary: 'Daftar permintaan gabung untuk laporan (OB)'
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar permintaan gabung
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DaftarGabungItem'
        '400':
          description: Validation Failed
        '401':
          description: Unauthorized

    post:
      tags:
        - OB
      summary: 'Kirim permintaan gabung (OB)'
      description: |
        OB lain mengirim permintaan bergabung pada laporan existing.
        
        **WebSocket Notification**: Notifikasi real-time dikirim ke OB pemilik laporan via WebSocket dengan tipe `GABUNG_LAPORAN`
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Permintaan gabung terkirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/GabungResponse'
        '400':
          description: Validation Failed
        '401':
          description: Unauthorized

  /api/ob/laporan/{laporan_id}/gabung/{kolaborasi_id}/setujui:
    patch:
      tags:
        - OB
      summary: 'Setujui permintaan gabung (OB pemilik laporan)'
      description: |
        OB pemilik laporan menerima permintaan bergabung dari OB lain.
        
        **WebSocket Notification**: Notifikasi real-time dikirim ke OB peminta via WebSocket dengan tipe `GABUNG_DISETUJUI`
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: kolaborasi_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permintaan gabung disetujui
        '400':
          description: Validation Failed
        '401':
          description: Unauthorized

  /api/ob/laporan/{laporan_id}/gabung/{kolaborasi_id}/tolak:
    patch:
      tags:
        - OB
      summary: 'Tolak permintaan gabung (OB pemilik laporan)'
      description: |
        OB pemilik laporan menolak permintaan bergabung dari OB lain.
        
        **WebSocket Notification**: Notifikasi real-time dikirim ke OB peminta via WebSocket dengan tipe `GABUNG_DIBATALKAN`
      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: kolaborasi_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permintaan gabung dibatalkan
        '400':
          description: Validation Failed
        '401':
          description: Unauthorized

# ADMIN
  /api/admin/user:
    get:
      tags:
        - Admin
      summary: 'List semua user (Admin)'
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
        - name: role_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar user

    post:
      tags:
        - Admin
      summary: 'Buat user baru (Admin)'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - nama_lengkap
                - role_id
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                nama_lengkap:
                  type: string
                role_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: User berhasil dibuat

  /api/admin/user/all-ob:
    get:
      tags:
        - Admin
      summary: 'List semua ob (Admin)'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar ob

  /api/admin/user/all-karyawan:
    get:
      tags:
        - Admin
      summary: 'List semua karyawan (Admin)'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar karyawan

  /api/admin/dashboard:
    get:
      tags:
        - Admin
      summary: 'Dashboard admin + KPI (Admin)'
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum:
              - harian
              - mingguan
              - bulanan
              - tahunan
            default: mingguan
      responses:
        '200':
          description: Data dashboard

  /api/admin/user-stats:
    get:
      tags:
        - Admin
      summary: 'Statistik user (Admin)'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistik user

  /api/admin/laporan:
    get:
      tags:
        - Admin
