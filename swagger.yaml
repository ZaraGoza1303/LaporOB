      responses:
        '200':
          description: Daftar tugas
    post:
      tags:
        - Tugas
      summary: 'Tambah jenis tugas (Admin)'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kategori_id
                - nama_tugas
              properties:
                kategori_id:
                  type: string
                  format: uuid
                nama_tugas:
                  type: string
      responses:
        '201':
          description: Tugas berhasil dibuat

  /api/tugas/{tugas_id}:
    get:
      tags:
        - Tugas
      summary: 'Detail tugas (Admin)'
      security:
        - BearerAuth: []
      parameters:
        - name: tugas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data tugas
    patch:
      tags:
        - Tugas
      summary: 'Edit tugas (Admin)'
