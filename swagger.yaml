      security:
        - BearerAuth: []
      parameters:
        - name: laporan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Laporan berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Laporan berhasil dihapus
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (bukan admin)
        '404':
          description: Laporan tidak ditemukan
        '500':
          description: Gagal menghapus laporan

