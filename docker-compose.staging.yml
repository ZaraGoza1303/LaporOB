# STAGING — image prod-like (Dockerfile), TANPA seed, TANPA volume source code.
# Nilai env dari platform deploy / secret manager (file lokal: salin .env.example jadi .env).
# Pakai: docker compose -f docker-compose.staging.yml up -d --build
# Alur: dev -> staging (MR) -> QA di sini -> staging -> prod (MR + tag).

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      - APP_PORT=${APP_PORT:-8000}
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - ./uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    restart: unless-stopped
    depends_on:
      - postgres_db
      - redis

  postgres_db:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-staginguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-lapor_ob_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_staging_data:/data

volumes:
  postgres_staging_data:
  redis_staging_data:
